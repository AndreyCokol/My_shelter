name: A3 camp market Godot QA (isolated)

on:
  pull_request:
    paths:
      - 'game/tests/e2e/run_a3_camp_market_tests.gd'
      - 'tools/run_a3_camp_market_qa.py'
      - '.github/workflows/a3-camp-market-qa.yml'
  push:
    branches: ['prototype/a3-camp-market-regression-*']

concurrency:
  group: a3-camp-market-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  camp-market-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHELTER_REQUIRE_ASSETS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot 4.7.2
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          echo /tmp/godot >> "$GITHUB_PATH"
          echo GODOT=Godot_v4.7.2-stable_linux.x86_64 >> "$GITHUB_ENV"
      - name: Install reviewed project assets
        run: python3 tools/install_ui_assets.py --download-ui
      - name: Execute real A3 camp market in Godot
        run: python3 tools/run_a3_camp_market_qa.py

  camp-market-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      SHELTER_REQUIRE_ASSETS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Godot 4.7.2 console
        shell: pwsh
        run: |
          $uri = 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip'
          Invoke-WebRequest $uri -OutFile "$env:RUNNER_TEMP/engine.zip"
          Expand-Archive "$env:RUNNER_TEMP/engine.zip" "$env:RUNNER_TEMP/engine"
          $engine = (Get-ChildItem "$env:RUNNER_TEMP/engine" -Filter '*_console.exe').FullName
          if (-not $engine) { throw 'Godot console executable missing' }
          "GODOT=$engine" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install reviewed project assets
        shell: pwsh
        run: |
          python tools/install_ui_assets.py --download-ui
          if ($LASTEXITCODE -ne 0) { throw 'Asset installation failed' }
      - name: Execute real A3 camp market in Godot
        shell: pwsh
        run: |
          python tools/run_a3_camp_market_qa.py
          if ($LASTEXITCODE -ne 0) { throw 'A3 camp market failed' }
