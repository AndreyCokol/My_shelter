name: A5 legacy-layout dual-view bridge QA

on:
  pull_request:
    paths:
      - 'game/systems/world/dual_view_layout_bridge.gd'
      - 'game/scenes/prototypes/dual_view_layout_preview.*'
      - 'game/tests/world/run_dual_view_layout_bridge_tests.gd'
      - 'tools/run_a5_layout_bridge_qa.py'
      - 'game/tests/world/run_dual_view_layout_visual_tests.gd'
      - 'tools/run_a5_layout_bridge_visual_qa.py'
      - '.github/workflows/a5-layout-bridge-qa.yml'
  push:
    branches:
      - 'integration/a5-dual-view-layout-bridge-*'

concurrency:
  group: a5-layout-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  layout-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SHELTER_REQUIRE_ASSETS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2 stable
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          echo /tmp/godot >> "$GITHUB_PATH"
          echo GODOT=Godot_v4.7.2-stable_linux.x86_64 >> "$GITHUB_ENV"
      - name: Install reviewed project UI assets
        run: python3 tools/install_ui_assets.py --download-ui
      - name: Check inherited dual-view cameras on final SHA
        run: python3 tools/run_a5_dual_view_qa.py
      - name: Verify legacy real layouts in one 3D scene
        run: python3 tools/run_a5_layout_bridge_qa.py
      - name: Ensure Xvfb is available for real 3D screenshots
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
      - name: Render real v5 hospital and city using both 3D camera modes
        run: python3 tools/run_a5_layout_bridge_visual_qa.py
      - name: Upload reproducible native Godot layout frames
        uses: actions/upload-artifact@v4
        with:
          name: a5-v5-hospital-city-dual-view-frames
          path: /tmp/shelter-a5-real-layout/*.png
          if-no-files-found: error

  layout-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      SHELTER_REQUIRE_ASSETS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Godot 4.7.2 stable console
        shell: pwsh
        run: |
          $uri = 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip'
          Invoke-WebRequest $uri -OutFile "$env:RUNNER_TEMP/engine.zip"
          Expand-Archive "$env:RUNNER_TEMP/engine.zip" "$env:RUNNER_TEMP/engine"
          $engine = (Get-ChildItem "$env:RUNNER_TEMP/engine" -Filter '*_console.exe').FullName
          if (-not $engine) { throw 'Godot console not found' }
          "GODOT=$engine" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install reviewed project UI assets
        shell: pwsh
        run: |
          python tools/install_ui_assets.py --download-ui
          if ($LASTEXITCODE -ne 0) { throw 'Asset install failed' }
      - name: Verify inherited dual-view camera test
        shell: pwsh
        run: |
          python tools/run_a5_dual_view_qa.py
          if ($LASTEXITCODE -ne 0) { throw 'Dual-view regression failed' }
      - name: Verify actual v4/v5 world geometry under Godot
        shell: pwsh
        run: |
          python tools/run_a5_layout_bridge_qa.py
          if ($LASTEXITCODE -ne 0) { throw 'Layout bridge failed' }
