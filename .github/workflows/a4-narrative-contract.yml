name: A4 isolated narrative contract tests
on:
  push:
    branches:
      - 'test/a4-npc-quest-policy-*'
  pull_request:
    paths:
      - 'game/systems/narrative/**'
      - 'game/tests/narrative/**'
      - '.github/workflows/a4-narrative-contract.yml'
permissions:
  contents: read
jobs:
  linux-a4:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Pin Godot 4.7.2 stable
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          curl --fail --location --retry 3 "$url" --output "$RUNNER_TEMP/godot.zip"
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          exe="$(find "$RUNNER_TEMP/godot" -type f -name 'Godot_v4.7.2-stable_linux.x86_64' | head -n 1)"
          test -n "$exe"
          chmod +x "$exe"
          echo "GODOT=$exe" >> "$GITHUB_ENV"
      - name: Run A4 source tests only
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT" --headless --path . --editor --import > a4-import.log 2>&1
          cat a4-import.log
          "$GODOT" --headless --path . --script game/tests/narrative/run_a4_npc_policy_tests.gd > a4-npc.log 2>&1
          cat a4-npc.log
          grep -Eq 'A4 NPC POLICY TESTS: [1-9][0-9]* checks, 0 failures' a4-npc.log
          "$GODOT" --headless --path . --script game/tests/narrative/run_a4_quest_gate_tests.gd > a4-quest.log 2>&1
          cat a4-quest.log
          grep -Eq 'A4 QUEST GATE TESTS: [1-9][0-9]* checks, 0 failures' a4-quest.log
          if grep -Eq 'SCRIPT ERROR:|ERROR:|WARNING: ObjectDB instances leaked' a4-npc.log a4-quest.log; then exit 1; fi
  windows-a4:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Pin Godot 4.7.2 stable
        shell: pwsh
        run: |
          $base = 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/'
          Invoke-WebRequest ($base + 'Godot_v4.7.2-stable_win64.exe.zip') -OutFile "$env:RUNNER_TEMP/godot.zip"
          Expand-Archive "$env:RUNNER_TEMP/godot.zip" "$env:RUNNER_TEMP/godot"
          $godot = (Get-ChildItem "$env:RUNNER_TEMP/godot" -Recurse -Filter '*_console.exe' | Select-Object -First 1).FullName
          if (-not $godot) { throw 'Pinned Godot console missing' }
          "GODOT=$godot" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Run A4 source tests only
        shell: pwsh
        run: |
          & $env:GODOT --headless --path . --editor --import
          if ($LASTEXITCODE -ne 0) { throw 'Godot import failed' }
          $scripts = @(
            @{file='game/tests/narrative/run_a4_npc_policy_tests.gd'; marker='A4 NPC POLICY'},
            @{file='game/tests/narrative/run_a4_quest_gate_tests.gd'; marker='A4 QUEST GATE'}
          )
          foreach ($suite in $scripts) {
            $output = (& $env:GODOT --headless --path . --script $suite.file 2>&1 | Out-String)
            Write-Output $output
            if ($LASTEXITCODE -ne 0 -or $output -notmatch ($suite.marker + ' TESTS: [1-9][0-9]* checks, 0 failures')) {
              throw "A4 suite failed: $($suite.file)"
            }
            if ($output -match 'SCRIPT ERROR:|ERROR:|WARNING: ObjectDB instances leaked') {
              throw "Godot runtime error: $($suite.file)"
            }
          }
