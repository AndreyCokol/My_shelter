name: A2 fixed third-floor starter hospital QA

on:
  pull_request:
    paths:
      - 'game/systems/world/fixed_start_hospital.gd'
      - 'game/tests/world/run_fixed_start_hospital_tests.gd'
      - 'game/tests/world/run_fixed_hospital_physics_tests.gd'
      - 'tools/run_a2_fixed_hospital_qa.py'
      - '.github/workflows/a2-fixed-hospital-qa.yml'
  push:
    branches: ['agent/a2/fixed-start-hospital-prototype-*']

concurrency:
  group: a2-fixed-hospital-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  hospital-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SHELTER_REQUIRE_ASSETS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2 stable
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          echo /tmp/godot >> "$GITHUB_PATH"
          echo GODOT=Godot_v4.7.2-stable_linux.x86_64 >> "$GITHUB_ENV"
      - name: Install reviewed game assets
        run: python3 tools/install_ui_assets.py --download-ui
      - name: Run true A2 third-floor and rooftop Godot tests
        run: python3 tools/run_a2_fixed_hospital_qa.py

  hospital-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      SHELTER_REQUIRE_ASSETS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Godot 4.7.2 stable console
        shell: pwsh
        run: |
          $url = 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip'
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP/engine.zip"
          Expand-Archive "$env:RUNNER_TEMP/engine.zip" "$env:RUNNER_TEMP/engine"
          $engine = (Get-ChildItem "$env:RUNNER_TEMP/engine" -Filter '*_console.exe').FullName
          if (-not $engine) { throw 'Pinned Godot console executable missing' }
          "GODOT=$engine" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install reviewed game assets
        shell: pwsh
        run: |
          python tools/install_ui_assets.py --download-ui
          if ($LASTEXITCODE -ne 0) { throw 'Asset install failed' }
      - name: Run true A2 third-floor and rooftop Godot tests
        shell: pwsh
        run: |
          python tools/run_a2_fixed_hospital_qa.py
          if ($LASTEXITCODE -ne 0) { throw 'A2 fixed hospital failed' }
