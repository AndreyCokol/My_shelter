name: A2 native Player/Enemy combat physics QA

on:
  pull_request:
    paths:
      - 'game/entities/player/player.gd'
      - 'game/entities/enemies/enemy.gd'
      - 'game/systems/combat/combat_loadout.gd'
      - 'game/tests/e2e/run_a2_real_combat_physics_tests.gd'
      - 'tools/run_a2_real_combat_qa.py'
      - '.github/workflows/a2-real-combat-qa.yml'
  push:
    branches: ['agent/a2/real-combat-physics-qa-*']

concurrency:
  group: a2-combat-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  real-combat-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SHELTER_REQUIRE_ASSETS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install exact Godot 4.7.2 stable
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          echo /tmp/godot >> "$GITHUB_PATH"
          echo GODOT=Godot_v4.7.2-stable_linux.x86_64 >> "$GITHUB_ENV"
      - name: Install reviewed art assets
        run: python3 tools/install_ui_assets.py --download-ui
      - name: Execute real Player Enemy Godot physics integration
        run: python3 tools/run_a2_real_combat_qa.py

  real-combat-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      SHELTER_REQUIRE_ASSETS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact Godot 4.7.2 stable console
        shell: pwsh
        run: |
          $url = 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip'
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP/engine.zip"
          Expand-Archive "$env:RUNNER_TEMP/engine.zip" "$env:RUNNER_TEMP/engine"
          $engine = (Get-ChildItem "$env:RUNNER_TEMP/engine" -Filter '*_console.exe').FullName
          if (-not $engine) { throw 'Pinned Windows Godot console missing' }
          "GODOT=$engine" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install reviewed art assets
        shell: pwsh
        run: |
          python tools/install_ui_assets.py --download-ui
          if ($LASTEXITCODE -ne 0) { throw 'Asset install failed' }
      - name: Execute real Player Enemy Godot physics integration
        shell: pwsh
        run: |
          python tools/run_a2_real_combat_qa.py
          if ($LASTEXITCODE -ne 0) { throw 'A2 native combat test failed' }
