name: A2-05 spatial whole-object and durable receipt contract QA

on:
  pull_request:
    paths:
      - 'game/systems/world/spatial_whole_object_intent.gd'
      - 'game/tests/world/run_spatial_whole_object_tests.gd'
      - 'tools/run_a2_whole_object_qa.py'
      - '.github/workflows/a2-whole-object-qa.yml'
  push:
    branches: ['agent/a2/spatial-whole-object-intent-*']

concurrency:
  group: a2-whole-object-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  whole-object-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SHELTER_REQUIRE_ASSETS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot 4.7.2 stable
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          echo /tmp/godot >> "$GITHUB_PATH"
          echo GODOT=Godot_v4.7.2-stable_linux.x86_64 >> "$GITHUB_ENV"
      - name: Install reviewed project assets
        run: python3 tools/install_ui_assets.py --download-ui
      - name: Execute real spatial and durable-receipt tests
        run: python3 tools/run_a2_whole_object_qa.py

  whole-object-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      SHELTER_REQUIRE_ASSETS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Godot 4.7.2 console
        shell: pwsh
        run: |
          $uri = 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip'
          Invoke-WebRequest $uri -OutFile "$env:RUNNER_TEMP/engine.zip"
          Expand-Archive "$env:RUNNER_TEMP/engine.zip" "$env:RUNNER_TEMP/engine"
          $engine = (Get-ChildItem "$env:RUNNER_TEMP/engine" -Filter '*_console.exe').FullName
          if (-not $engine) { throw 'Missing pinned console executable' }
          "GODOT=$engine" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install reviewed project assets
        shell: pwsh
        run: |
          python tools/install_ui_assets.py --download-ui
          if ($LASTEXITCODE -ne 0) { throw 'Assets installation failed' }
      - name: Execute real spatial and durable-receipt tests
        shell: pwsh
        run: |
          python tools/run_a2_whole_object_qa.py
          if ($LASTEXITCODE -ne 0) { throw 'A2 whole-object contract failed' }
