name: MyShelter evergreen Windows preview

on:
  pull_request:
    paths:
      - 'tools/delivery/**'
      - '.github/workflows/windows-evergreen.yml'
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Full 40-character A5-reviewed game source SHA'
        required: true
        type: string
      publish_preview:
        description: 'After build and smoke, publish a PUBLIC preview GitHub Release (needs asset-rights approval)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  updater-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline updater tests (no secrets/network)
        run: python -m unittest discover -s tools/delivery -p 'test_*.py' -v

  installer-windows:
    runs-on: windows-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline updater tests on real Windows
        shell: pwsh
        run: |
          python -m unittest discover -s tools/delivery -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows updater unit tests failed' }
      - name: Install local launcher without admin, network or scheduled tasks
        shell: pwsh
        run: |
          # Use spaces in path; merely checking file existence is not enough.
          $install = Join-Path $env:RUNNER_TEMP 'My Shelter Install'
          & ./tools/delivery/Install-MyShelter.ps1 -InstallDir $install -NoScheduledTask -NoDesktopShortcut
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'Bootstrap installer failed' }
          foreach ($name in @('windows_updater.py','MyShelter.cmd','UpdateMyShelter.cmd','RollbackMyShelter.cmd')) {
            if (-not (Test-Path (Join-Path $install $name))) { throw "Missing local installer file: $name" }
          }
          foreach ($name in @('MyShelter.cmd', 'UpdateMyShelter.cmd')) {
            $cmd = Join-Path $install $name
            # PowerShell's call operator handles paths with spaces without cmd /c re-quoting.
            $output = (& $cmd --help 2>&1 | Out-String)
            if ($LASTEXITCODE -ne 0 -or $output -notmatch 'usage:') {
              throw "CMD wrapper invocation failed: $name : $output"
            }
          }
          Write-Output 'WINDOWS EVERGREEN CMD ROOT QUOTING: PASS'
          Write-Output 'WINDOWS EVERGREEN INSTALLER: PASS'

  build-windows:
    if: github.event_name == 'workflow_dispatch'
    needs: [updater-tests, installer-windows]
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      PYTHONUTF8: '1'
      SHELTER_REQUIRE_ASSETS: '1'
    steps:
      - name: Reject ambiguous or non-SHA ref
        shell: pwsh
        run: |
          if ($env:SOURCE_SHA -cnotmatch '^[0-9a-f]{40}$') {
            throw 'Provide an exact lowercase full commit SHA, not a PR, branch, or tag'
          }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Confirm checkout provenance
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -cne $env:SOURCE_SHA) { throw 'Checkout does not match approved source_sha' }
          if (-not (Test-Path 'export_presets.cfg')) { throw 'Game export preset missing' }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact Godot engine and release templates
        shell: pwsh
        run: |
          $base = 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/'
          Invoke-WebRequest ($base + 'Godot_v4.7.2-stable_win64.exe.zip') -OutFile "$env:RUNNER_TEMP/engine.zip"
          Expand-Archive "$env:RUNNER_TEMP/engine.zip" "$env:RUNNER_TEMP/engine"
          $engine = (Get-ChildItem "$env:RUNNER_TEMP/engine" -Recurse -Filter '*_console.exe' | Select-Object -First 1).FullName
          if (-not $engine) { throw 'Godot console engine missing' }
          "GODOT=$engine" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Invoke-WebRequest ($base + 'Godot_v4.7.2-stable_export_templates.tpz') -OutFile "$env:RUNNER_TEMP/templates.zip"
          @'
          import os, pathlib, zipfile
          dest = pathlib.Path(os.environ['APPDATA']) / 'Godot/export_templates/4.7.2.stable'
          dest.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(pathlib.Path(os.environ['RUNNER_TEMP']) / 'templates.zip') as z:
              for name in ['version.txt', 'windows_release_x86_64.exe', 'windows_debug_x86_64.exe']:
                  (dest / name).write_bytes(z.read('templates/' + name))
          '@ | python -
      - name: Install verified UI resources
        shell: pwsh
        run: |
          python tools/install_ui_assets.py --download-ui
          if ($LASTEXITCODE -ne 0) { throw 'Asset installation failed' }
      - name: Run game test suites and documentation
        shell: pwsh
        run: |
          python tools/run_godot_checks.py
          if ($LASTEXITCODE -ne 0) { throw 'Game regression suite failed' }
          python tools/check_g0_docs.py
          if ($LASTEXITCODE -ne 0) { throw 'Documentation check failed' }
      - name: Export Windows EXE and strict offline smoke test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/windows | Out-Null
          & $env:GODOT --headless --path . --export-release 'Windows Desktop' build/windows/MyShelter.exe
          if ($LASTEXITCODE -ne 0) { throw 'Godot Windows export failed' }
          $exe = Join-Path $PWD 'build/windows/MyShelter.exe'
          $stdout = Join-Path $PWD 'build/windows/runtime.log'
          $stderr = Join-Path $PWD 'build/windows/runtime-errors.log'
          $p = Start-Process -FilePath $exe -ArgumentList '--headless','--audio-driver','Dummy','--quit-after','10' -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $p.WaitForExit(30000)) { $p.Kill(); throw 'Offline EXE startup timed out' }
          if ($p.ExitCode -ne 0) { throw "Offline EXE exited $($p.ExitCode)" }
          $logs = (Get-Content $stdout -Raw) + (Get-Content $stderr -Raw)
          if ($logs -match 'SCRIPT ERROR:|ERROR:|instances leaked') { throw 'Godot startup reported errors' }
          if ($logs -notmatch 'Playable prototype initialized; schema v4') { throw 'Missing expected runtime marker' }
          $assetLog = (& $env:GODOT --headless --main-pack $exe --script "$PWD/tools/verify_export_assets.gd" 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $assetLog -notmatch 'EXPORTED ASSETS: 18 Kibyra textures verified PASS') {
            throw 'Offline export lost verified textures'
          }
      - name: Package only immutable executable plus provenance README
        shell: pwsh
        run: |
          $env:SHA = $env:SOURCE_SHA
          @'
          import os, pathlib, zipfile
          root = pathlib.Path('build/windows')
          exe = root / 'MyShelter.exe'
          if not exe.is_file() or exe.stat().st_size < 1024:
              raise RuntimeError('Missing Windows executable')
          with exe.open('rb') as f:
              if f.read(2) != b'MZ':
                  raise RuntimeError('Invalid PE header')
          with zipfile.ZipFile(root / 'MyShelter-Windows-x64.zip', 'w', zipfile.ZIP_DEFLATED, 6) as z:
              z.write(exe, 'MyShelter.exe')
              z.writestr('README.txt', 'MyShelter Windows QA preview\nSource SHA: ' + os.environ['SHA'] + '\nNOT a public game release or final G0.\n')
          '@ | python -
      - uses: actions/upload-artifact@v4
        with:
          name: myshelter-windows-candidate
          path: build/windows/MyShelter-Windows-x64.zip
          retention-days: 14
          if-no-files-found: error

  publish-preview:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_preview == true && github.actor == 'AndreyCokol'
    needs: [updater-tests, installer-windows, build-windows]
    runs-on: ubuntu-latest
    environment: preview-release
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: myshelter-windows-candidate
          path: publication
      - name: Create pinned manifest and immutable preview release
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, re, zipfile
          sha = os.environ['SOURCE_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('Not a full source SHA')
          z = pathlib.Path('publication/MyShelter-Windows-x64.zip')
          with zipfile.ZipFile(z) as archive:
              if sorted(archive.namelist()) != ['MyShelter.exe', 'README.txt']:
                  raise SystemExit('Unexpected package members')
              if archive.read('MyShelter.exe')[:2] != b'MZ':
                  raise SystemExit('Missing PE header')
          manifest = {
              'schema': 1,
              'application': 'MyShelter',
              'channel': 'preview',
              'source_sha': sha,
              'package': z.name,
              'entrypoint': 'MyShelter.exe',
              'archive_sha256': hashlib.sha256(z.read_bytes()).hexdigest(),
              'archive_size': z.stat().st_size,
          }
          pathlib.Path('publication/manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True), encoding='utf-8')
          PY
          tag="myshelter-preview-$SOURCE_SHA"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to overwrite immutable release $tag" >&2
            exit 1
          fi
          gh release create "$tag" \
            publication/MyShelter-Windows-x64.zip publication/manifest.json \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --prerelease \
            --title "MyShelter QA preview ($SOURCE_SHA)" \
            --notes "Manually promoted Windows preview. Exact source $SOURCE_SHA. Automated contracts + offline smoke tested. NOT G0/G4 owner approval. Check asset rights before publishing."
