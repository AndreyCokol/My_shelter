name: Godot core bootstrap
on:
  push:
  pull_request:
concurrency:
  group: asset-ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    env:
      SHELTER_REQUIRE_ASSETS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          echo /tmp/godot >> "$GITHUB_PATH"
      - name: Install reviewed Kibyra UI resources
        run: python3 tools/install_ui_assets.py --download-ui
      - name: Import and run core tests
        run: |
          set -euo pipefail
          GODOT=Godot_v4.7.2-stable_linux.x86_64 python3 tools/run_godot_checks.py
          python3 tools/check_g0_docs.py

      - name: Render the real UI with software OpenGL
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
          GODOT=Godot_v4.7.2-stable_linux.x86_64 python3 tools/run_visual_checks.py
      - name: Keep rendered game views
        uses: actions/upload-artifact@v4
        with:
          name: asset-ui-rendered-views
          path: /tmp/shelter-visual/*.png
          if-no-files-found: error
