name: A5 dual-view 3D QA (isolated)

on:
  pull_request:
    paths:
      - 'game/systems/world/dual_view_space.gd'
      - 'game/scenes/prototypes/dual_view_preview.gd'
      - 'game/scenes/prototypes/dual_view_preview.tscn'
      - 'game/tests/world/run_dual_view_tests.gd'
      - 'tools/run_a5_dual_view_qa.py'
      - 'tools/run_a5_dual_view_visual_qa.py'
      - 'game/scenes/prototypes/dual_view_preview_ui.gd'
      - 'game/tests/world/run_dual_view_visual_tests.gd'
      - '.github/workflows/a5-dual-view-qa.yml'
  push:
    branches: ['agent/a2/dual-view-3d-poc-*']

concurrency:
  group: a5-dual-view-qa-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dual-view-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHELTER_REQUIRE_ASSETS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot 4.7.2
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          echo /tmp/godot >> "$GITHUB_PATH"
          echo GODOT=Godot_v4.7.2-stable_linux.x86_64 >> "$GITHUB_ENV"
      - name: Install reviewed project assets
        run: python3 tools/install_ui_assets.py --download-ui
      - name: Run actual A2-08 Godot standalone test
        run: python3 tools/run_a5_dual_view_qa.py
      - name: Install Xvfb for software-rendered desktop captures
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
      - name: Render and verify actual PC preview frames
        run: python3 tools/run_a5_dual_view_visual_qa.py
      - name: Keep true 1280x720 topdown and FPS frames
        uses: actions/upload-artifact@v4
        with:
          name: a5-dual-view-rendered-pc-frames
          path: /tmp/shelter-dual-view/*.png
          if-no-files-found: error

  dual-view-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      SHELTER_REQUIRE_ASSETS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Godot 4.7.2 console
        shell: pwsh
        run: |
          $uri = 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip'
          Invoke-WebRequest $uri -OutFile "$env:RUNNER_TEMP/engine.zip"
          Expand-Archive "$env:RUNNER_TEMP/engine.zip" "$env:RUNNER_TEMP/engine"
          $engine = (Get-ChildItem "$env:RUNNER_TEMP/engine" -Filter '*_console.exe').FullName
          if (-not $engine) { throw 'Godot console executable missing' }
          "GODOT=$engine" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install reviewed project assets
        shell: pwsh
        run: |
          python tools/install_ui_assets.py --download-ui
          if ($LASTEXITCODE -ne 0) { throw 'Asset installation failed' }
      - name: Run actual A2-08 Godot standalone test
        shell: pwsh
        run: |
          python tools/run_a5_dual_view_qa.py
          if ($LASTEXITCODE -ne 0) { throw 'A2-08 dual-view tests failed' }
