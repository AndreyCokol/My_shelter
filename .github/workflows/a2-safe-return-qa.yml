name: A2 safe return and reachable-route QA

on:
  pull_request:
    paths:
      - 'game/systems/world/safe_return_position.gd'
      - 'game/systems/world/safe_reachable_position.gd'
      - 'game/tests/world/run_safe_return_tests.gd'
      - 'game/tests/world/run_safe_reachable_tests.gd'
      - 'tools/run_a2_safe_return_qa.py'
      - '.github/workflows/a2-safe-return-qa.yml'
  push:
    branches: ['agent/a2/safe-return-prototype-*']

concurrency:
  group: a2-safe-return-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  safe-return-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SHELTER_REQUIRE_ASSETS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install exact Godot 4.7.2 stable
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          echo /tmp/godot >> "$GITHUB_PATH"
          echo GODOT=Godot_v4.7.2-stable_linux.x86_64 >> "$GITHUB_ENV"
      - name: Install reviewed project UI dependencies
        run: python3 tools/install_ui_assets.py --download-ui
      - name: Execute actual A2 safe-return and route proofs
        run: python3 tools/run_a2_safe_return_qa.py

  safe-return-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      SHELTER_REQUIRE_ASSETS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact Godot 4.7.2 stable
        shell: pwsh
        run: |
          $uri = 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip'
          Invoke-WebRequest $uri -OutFile "$env:RUNNER_TEMP/engine.zip"
          Expand-Archive "$env:RUNNER_TEMP/engine.zip" "$env:RUNNER_TEMP/engine"
          $engine = (Get-ChildItem "$env:RUNNER_TEMP/engine" -Filter '*_console.exe').FullName
          if (-not $engine) { throw 'Godot console executable missing' }
          "GODOT=$engine" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install reviewed project UI dependencies
        shell: pwsh
        run: |
          python tools/install_ui_assets.py --download-ui
          if ($LASTEXITCODE -ne 0) { throw 'Asset installation failed' }
      - name: Execute actual A2 safe-return and route proofs
        shell: pwsh
        run: |
          python tools/run_a2_safe_return_qa.py
          if ($LASTEXITCODE -ne 0) { throw 'A2 safe return test failed' }
